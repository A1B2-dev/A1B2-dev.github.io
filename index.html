<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>执剑议会 · 入口</title>
<meta name="description" content="内部监测与调度系统，授权访问">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #0b1b3d 0%, #050a18 60%, #02040a 100%);
    color:#cfe3ff; font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
    overflow:hidden;
  }
  .sword { font-size:64px; margin-bottom:18px; opacity:.9; }
  .title { font-size:26px; letter-spacing:8px; color:#eaf2ff; font-weight:600; }
  .sub { font-size:13px; letter-spacing:4px; color:#5c7fb8; margin-top:8px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#3d7dff;
         margin-top:36px; animation:pulse 1.2s infinite ease-in-out; }
  .dot:nth-child(2){ animation-delay:.2s } .dot:nth-child(3){ animation-delay:.4s }
  @keyframes pulse { 0%,100%{opacity:.2; transform:scale(.8)} 50%{opacity:1; transform:scale(1.1)} }
  .tip { margin-top:40px; font-size:12px; color:#3e5c8a; }
  .link { display:none; margin-top:16px; font-size:14px; color:#7fb0ff; word-break:break-all; }
</style>
</head>
<body>
  <div>
    <div class="sword">⚔</div>
    <div class="title">执剑议会</div>
    <div class="sub">SWORD PARLIAMENT</div>
    <div style="margin-top:36px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="tip">正在验证访问权限，正在接入调度系统…</div>
    <a class="link" id="manual" href="#">如果未自动跳转，请点击此处进入</a>
  </div>
<script>
(function(){
  var m = document.getElementById('manual');
  function go(url){
    m.href = url; m.style.display='block';
    setTimeout(function(){ location.replace(url); }, 1200);
  }
  fetch('config.json', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(cfg){
      if(cfg && cfg.target && /^https?:\/\//.test(cfg.target)){
        go(cfg.target);
      } else { m.style.display='block'; m.textContent='入口未配置，请稍后再试'; }
    })
    .catch(function(){ m.style.display='block'; m.textContent='入口获取失败，请点击重试或稍后再来'; });
})();
</script>
</body>
</html>
